name: Native Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'AndroidApp/**'
      - '.github/workflows/android-native-debug.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AndroidApp/**'
      - '.github/workflows/android-native-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build native debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: study-app-native-debug-apk
          path: AndroidApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-screenshots:
    name: Emulator tests and screenshots (${{ matrix.name }})
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            profile: pixel_5
          - name: compact
            profile: Nexus 4
          - name: tablet
            profile: Nexus 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator tests and pull screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set +e; adb shell settings put global hide_error_dialogs 1; adb shell input keyevent 82; adb shell wm dismiss-keyguard; adb shell svc power stayon true; adb shell settings put system screen_off_timeout 600000; cd AndroidApp; ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace; build_exit=$?; if [ $build_exit -ne 0 ]; then exit $build_exit; fi; adb install -r app/build/outputs/apk/debug/app-debug.apk; app_exit=$?; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; test_apk_exit=$?; if [ $app_exit -ne 0 ] || [ $test_apk_exit -ne 0 ]; then exit 1; fi; sleep 3; adb shell run-as com.studyapp.pomodoro.nativeapp rm -rf files/screenshots 2>/dev/null; test_output=$(adb shell am instrument -w -r com.studyapp.pomodoro.nativeapp.test/androidx.test.runner.AndroidJUnitRunner 2>&1); echo "$test_output"; mkdir -p ../Screenshots; echo "$test_output" > ../Screenshots/test-output.txt; echo "$test_output" | grep -q "OK (3 tests)"; test_exit=$?; for f in $(adb shell run-as com.studyapp.pomodoro.nativeapp ls files/screenshots 2>/dev/null); do adb exec-out run-as com.studyapp.pomodoro.nativeapp cat files/screenshots/$f > ../Screenshots/$f; done; screenshot_count=$(find ../Screenshots -name '*.png' | wc -l); echo "Pulled $screenshot_count screenshots"; if [ "$screenshot_count" -ne 10 ]; then test_exit=1; fi; exit $test_exit

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pomodoro-emulator-screenshots-${{ matrix.name }}
          path: Screenshots
          if-no-files-found: warn
          retention-days: 14
