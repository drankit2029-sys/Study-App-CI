name: Native Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'AndroidApp/**'
      - '.github/workflows/android-native-debug.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AndroidApp/**'
      - '.github/workflows/android-native-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build native debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: study-app-native-debug-apk
          path: AndroidApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-screenshots:
    name: Emulator tests and screenshots
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator tests and pull screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set +e; adb shell input keyevent 82; adb shell wm dismiss-keyguard; adb shell svc power stayon true; adb shell settings put system screen_off_timeout 600000; cd AndroidApp; ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace; test_exit=$?; mkdir -p ../Screenshots; adb pull /sdcard/Android/data/com.studyapp.pomodoro.nativeapp/files/screenshots/. ../Screenshots/ || true; exit $test_exit

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pomodoro-emulator-screenshots
          path: Screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pomodoro-emulator-test-reports
          path: AndroidApp/app/build/reports/androidTests
          if-no-files-found: warn
          retention-days: 14
