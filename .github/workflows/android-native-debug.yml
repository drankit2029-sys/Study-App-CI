name: Native Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'AndroidApp/**'
      - '.github/workflows/android-native-debug.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AndroidApp/**'
      - '.github/workflows/android-native-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build native debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidApp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: study-app-native-debug-apk
          path: AndroidApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
