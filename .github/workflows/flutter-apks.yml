name: Flutter Debug and Release APKs

on:
  push:
    paths:
      - 'FlutterApp/**'
      - '.github/workflows/flutter-apks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flutter-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: FlutterApp
        run: flutter pub get

      - name: Generate and brand Android scaffold
        working-directory: FlutterApp
        run: bash tool/bootstrap_android.sh

      - name: Upload generated Android scaffold
        uses: actions/upload-artifact@v7
        with:
          name: flutter-android-scaffold
          path: FlutterApp/android
          if-no-files-found: error
          retention-days: 14

      - name: Build debug APK
        working-directory: FlutterApp
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: FlutterApp
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: study-app-flutter-debug-apk
          path: FlutterApp/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: study-app-flutter-release-apk
          path: FlutterApp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
